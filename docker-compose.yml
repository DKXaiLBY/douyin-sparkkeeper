services:
  sparkkeeper:
    build:
      context: .
      dockerfile: Dockerfile
      # 网络受限时可选加速（默认空=官方源），PowerShell 示例：
      #   $env:APT_MIRROR="mirrors.tuna.tsinghua.edu.cn"; docker compose up -d --build
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: sparkkeeper:latest
    container_name: sparkkeeper
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # 凭证加密口令：务必通过 secret / env 注入，切勿写进镜像
      - APP_PASSPHRASE=${APP_PASSPHRASE:-}
      - PLATFORM=${PLATFORM:-mock}
      - PORT=3000
      # 容器内必须监听所有网卡，否则端口映射无法访问
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - TZ=${TZ:-Asia/Shanghai}
      - SAFETY_MODE=${SAFETY_MODE:-true}
      - DAILY_CAP=${DAILY_CAP:-20}
      - CRON=${CRON:-0 20 * * *}
      - NOTIFY_CHANNEL=${NOTIFY_CHANNEL:-none}
      - WEATHER_ENABLED=${WEATHER_ENABLED:-true}
    volumes:
      # 加密凭证与数据库持久化到宿主机
      - ./data:/data
    # 仅开发/调试时启用（Playwright 需要）；生产可移除
    # cap_add:
    #   - SYS_ADMIN
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
